<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TopBliss Events Calendar</title>
<meta name="description" content="Company events, birthdays, and memos from Top Bliss Solutions HR.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F2F4EC;
    --surface:#FFFFFF;
    --surface-2:#E7EBDE;
    --surface-3:#DCE3D0;
    --ink:#1B2A1E;
    --ink-soft:#57634F;
    --ink-faint:#8B9682;
    --border:#D7DECB;
    --accent:#2F5D3A;
    --accent-ink:#FFFFFF;
    --accent-soft:#E1EBDD;
    --danger:#B5533C;
    --danger-soft:#F3E2DC;
    --cat-holiday:#B8791F;
    --cat-training:#2D6E7E;
    --cat-deadline:#B5533C;
    --cat-meeting:#6B4E71;
    --cat-celebration:#A85572;
    --shadow:0 20px 44px -18px rgba(27,42,30,0.32);
    --radius:14px;
    --font-display:'Fraunces',ui-serif,Georgia,serif;
    --font-body:'Public Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121911;
      --surface:#1A231A;
      --surface-2:#212B20;
      --surface-3:#2A362A;
      --ink:#E9EEE3;
      --ink-soft:#A7B39D;
      --ink-faint:#74806B;
      --border:#34402F;
      --accent:#7DBB80;
      --accent-ink:#0E170F;
      --accent-soft:#24352A;
      --danger:#D9795C;
      --danger-soft:#3A2620;
      --cat-holiday:#D9A24C;
      --cat-training:#4FA3B5;
      --cat-deadline:#D9795C;
      --cat-meeting:#A47DAE;
      --cat-celebration:#D98BA8;
      --shadow:0 20px 44px -18px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121911;
    --surface:#1A231A;
    --surface-2:#212B20;
    --surface-3:#2A362A;
    --ink:#E9EEE3;
    --ink-soft:#A7B39D;
    --ink-faint:#74806B;
    --border:#34402F;
    --accent:#7DBB80;
    --accent-ink:#0E170F;
    --accent-soft:#24352A;
    --danger:#D9795C;
    --danger-soft:#3A2620;
    --cat-holiday:#D9A24C;
    --cat-training:#4FA3B5;
    --cat-deadline:#D9795C;
    --cat-meeting:#A47DAE;
    --cat-celebration:#D98BA8;
    --shadow:0 20px 44px -18px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 64px;
  }
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:18px 28px;
    padding-bottom:22px;
    margin-bottom:22px;
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:14px;margin-right:auto;}
  .brand-mark{
    width:44px;height:44px;border-radius:11px;
    background:#FFFFFF;border:1px solid var(--border);
    object-fit:contain;padding:4px;flex:none;
  }
  .brand-eyebrow{
    font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:600;margin-bottom:2px;
  }
  .brand h1{font-size:26px;}

  .month-nav{display:flex;align-items:center;gap:10px;}
  .nav-btn{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
    transition:background .15s ease, border-color .15s ease;
  }
  .nav-btn:hover{background:var(--surface-2);}
  .nav-btn:focus-visible, .btn:focus-visible, .chip:focus-visible, .day-cell:focus-visible, .upcoming-item:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .month-label{
    font-family:var(--font-mono);font-size:14.5px;font-weight:500;
    min-width:148px;text-align:center;color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .btn-ghost{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
    border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .btn-ghost:hover{color:var(--ink);background:var(--surface-2);}
  .btn{
    border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;
    cursor:pointer;transition:filter .15s ease, background .15s ease;
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-secondary{background:var(--surface-2);color:var(--ink);}
  .btn-secondary:hover{background:var(--surface-3);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-danger:hover{filter:brightness(1.06);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .role-pill{
    align-self:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:5px 10px;border-radius:99px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-soft);
  }
  .role-pill.editor{background:var(--accent-soft);color:var(--accent);border-color:transparent;}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start;}
  @media (max-width:860px){.layout{grid-template-columns:1fr;}}

  .banner{
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:10px 14px;font-size:13px;color:var(--ink-soft);margin-bottom:16px;
  }

  .calendar-panel{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;
  }
  .weekday-row{
    display:grid;grid-template-columns:repeat(7,1fr);
    font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-faint);padding:0 2px 8px;
  }
  .weekday-row span{text-align:center;}
  .grid{
    display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;
    gap:6px;
  }
  .day-cell{
    min-height:96px;border-radius:9px;border:1px solid transparent;
    background:var(--surface);padding:7px 6px;cursor:pointer;
    display:flex;flex-direction:column;gap:4px;text-align:left;
    transition:background .12s ease, border-color .12s ease;
  }
  .day-cell:hover{background:var(--surface-2);}
  .day-cell.today{border-color:var(--accent);}
  .day-cell.other-month{opacity:.42;}
  .day-number{
    font-family:var(--font-mono);font-size:12.5px;font-weight:500;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .day-cell.today .day-number{
    color:var(--accent-ink);background:var(--accent);width:20px;height:20px;
    border-radius:6px;display:flex;align-items:center;justify-content:center;
  }
  .chip{
    display:flex;align-items:center;gap:5px;background:var(--surface-2);
    border:none;border-radius:6px;padding:3px 6px;font-size:11px;font-weight:600;
    color:var(--ink);cursor:pointer;text-align:left;width:100%;
  }
  .chip:hover{background:var(--surface-3);}
  .chip-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .chip-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .more-chip{
    font-size:10.5px;font-weight:600;color:var(--ink-faint);background:none;
    border:none;padding:2px 6px;cursor:pointer;text-align:left;
  }
  .more-chip:hover{color:var(--ink-soft);}

  .legend{
    display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;padding-top:14px;
    border-top:1px solid var(--border);
  }
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);}
  .legend-dot{width:8px;height:8px;border-radius:50%;flex:none;}

  /* ---------- sidebar ---------- */
  .sidebar{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;position:sticky;top:20px;
  }
  .sidebar h2{font-size:15.5px;margin-bottom:2px;}
  .sidebar-sub{font-size:12px;color:var(--ink-faint);margin-bottom:14px;}
  .upcoming-list{display:flex;flex-direction:column;gap:2px;}
  .upcoming-item{
    display:grid;grid-template-columns:40px 1fr;gap:10px;
    padding:9px 4px;border-radius:8px;background:none;border:none;
    text-align:left;cursor:pointer;width:100%;
  }
  .upcoming-item:hover{background:var(--surface-2);}
  .upcoming-date{
    font-family:var(--font-mono);font-size:10.5px;font-weight:600;line-height:1.25;
    color:var(--ink-soft);padding-left:8px;border-left:2px solid var(--border);
    font-variant-numeric:tabular-nums;
  }
  .upcoming-item .upcoming-date{border-left-color:var(--cat, var(--border));}
  .upcoming-title{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3;}
  .upcoming-meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .empty-state{
    padding:22px 6px;text-align:center;color:var(--ink-faint);font-size:13px;
  }
  .empty-state .btn{margin-top:10px;}

  /* ---------- overlay / modals ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,20,13,.44);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:40;
  }
  .overlay[hidden]{display:none;}
  .modal{
    background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
    width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
    border:1px solid var(--border);
  }
  .modal-pad{padding:22px;}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .modal-close{
    background:none;border:none;color:var(--ink-faint);font-size:20px;cursor:pointer;
    line-height:1;padding:2px 4px;flex:none;
  }
  .modal-close:hover{color:var(--ink);}

  .badge{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
    letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;border-radius:99px;
    color:var(--accent-ink);
  }
  .badge-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

  .detail-title{font-size:22px;margin:10px 0 4px;}
  .detail-row{
    display:flex;gap:10px;align-items:flex-start;padding:9px 0;
    border-top:1px solid var(--border);font-size:13.5px;
  }
  .detail-row:first-of-type{border-top:none;margin-top:10px;}
  .detail-label{
    width:78px;flex:none;color:var(--ink-faint);font-size:11px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;padding-top:2px;
  }
  .detail-value{color:var(--ink);line-height:1.5;}
  .detail-value.muted{color:var(--ink-soft);}
  .detail-actions{display:flex;gap:8px;margin-top:20px;}
  .confirm-row{
    display:flex;align-items:center;gap:10px;margin-top:20px;padding:12px;
    background:var(--danger-soft);border-radius:10px;font-size:13px;color:var(--ink);
  }
  .confirm-row .btn{padding:7px 12px;font-size:12.5px;}

  /* ---------- form ---------- */
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  input,select,textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:9px 10px;font-size:13.5px;color:var(--ink);
    font-family:var(--font-body);
  }
  input[type="date"],input[type="time"]{font-family:var(--font-mono);}
  textarea{resize:vertical;min-height:64px;line-height:1.5;}
  .check-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .check-row input{width:16px;height:16px;flex:none;}
  .check-row label{font-size:12.5px;color:var(--ink-soft);margin:0;}
  .cat-select{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .cat-opt{
    display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;
    border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
    cursor:pointer;font-size:10.5px;font-weight:600;color:var(--ink-soft);text-align:center;
  }
  .cat-opt.active{border-color:var(--cat,var(--accent));background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--cat,var(--accent));}
  .cat-dot{width:13px;height:13px;border-radius:50%;background:var(--cat,var(--ink-faint));}
  .form-error{color:var(--danger);font-size:12px;margin:-6px 0 12px;min-height:1em;}
  .form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .field-hint{font-size:11.5px;color:var(--ink-faint);margin-top:6px;}

  .file-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .file-label{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
    background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:12.5px;
    font-weight:600;color:var(--ink-soft);cursor:pointer;
  }
  .file-label:hover{background:var(--surface-3);}
  .file-label input[type="file"]{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  .photo-status{font-size:11.5px;color:var(--ink-faint);}
  .photo-preview{position:relative;margin-top:10px;max-width:220px;}
  .photo-preview img{width:100%;border-radius:10px;display:block;max-height:140px;object-fit:cover;}
  .photo-remove{
    position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
    border:none;background:rgba(15,20,13,.6);color:#fff;font-size:14px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .photo-remove:hover{background:rgba(15,20,13,.8);}

  /* ---------- detail extras ---------- */
  .detail-photo{
    width:100%;max-height:220px;object-fit:cover;border-radius:12px;
    display:block;margin:12px 0 2px;
  }
  .detail-link{
    color:var(--accent);font-weight:600;text-decoration:none;
    border-bottom:1px solid currentColor;padding-bottom:1px;
    word-break:break-word;
  }
  .detail-link:hover{opacity:.82;}
  .series-note{font-size:11.5px;color:var(--ink-faint);margin-top:10px;}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:6px;margin:-4px 0 20px;}
  .tab{
    background:none;border:none;border-bottom:2px solid transparent;
    padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink-faint);cursor:pointer;
  }
  .tab:hover{color:var(--ink);}
  .tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px;}

  /* ---------- shared panels / rows ---------- */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;max-width:760px;}
  .panel.wide{max-width:none;}
  .list-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .list-head h2{font-size:19px;}
  .list-sub{font-size:12.5px;color:var(--ink-faint);}
  .row-actions{display:flex;gap:6px;}
  .mini-btn{
    border:1px solid var(--border);background:var(--surface-2);color:var(--ink-soft);
    border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:600;cursor:pointer;
  }
  .mini-btn:hover{background:var(--surface-3);color:var(--ink);}
  .mini-btn.danger{color:var(--danger);}
  .mini-btn.armed{background:var(--danger-soft);border-color:var(--danger);}
  .mini-btn:focus-visible, .filter-chip:focus-visible, .memo-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- birthdays ---------- */
  .bday-month{
    font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-faint);margin:20px 0 6px;padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .bday-list > .bday-month:first-child{margin-top:0;}
  .bday-row{
    display:grid;grid-template-columns:48px 1fr auto auto;gap:14px;align-items:center;
    padding:10px 8px;border-radius:9px;
  }
  .bday-row.today{background:var(--accent-soft);}
  .bday-date{
    font-family:var(--font-mono);font-size:12px;font-weight:600;line-height:1.25;
    color:var(--cat-celebration);padding-left:8px;border-left:2px solid var(--cat-celebration);
    font-variant-numeric:tabular-nums;
  }
  .bday-name{font-size:14.5px;font-weight:600;color:var(--ink);}
  .bday-team{font-size:12px;color:var(--ink-faint);margin-top:1px;}
  .bday-when{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .bday-row.today .bday-when{color:var(--accent);font-weight:700;}
  @media (max-width:560px){.bday-row{grid-template-columns:48px 1fr auto;}.bday-row .row-actions{grid-column:2 / -1;}}

  /* ---------- memos ---------- */
  .memo-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .filter-chip{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
    border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .filter-chip:hover{background:var(--surface-2);}
  .filter-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .memo-list{display:flex;flex-direction:column;gap:10px;}
  .memo-card{
    display:block;width:100%;text-align:left;background:var(--surface);
    border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;
  }
  .memo-card:hover{background:var(--surface-2);}
  .memo-card.pinned{border-color:var(--accent);}
  .memo-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .memo-title{display:block;font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--ink);margin-bottom:4px;}
  .memo-excerpt{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:13px;color:var(--ink-soft);line-height:1.5;
  }
  .memo-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);}
  .pin-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);}
  .memo-body{white-space:pre-wrap;line-height:1.65;font-size:14px;color:var(--ink);padding:14px 0 4px;word-break:break-word;}
  .modal.wide{max-width:600px;}
  textarea.tall{min-height:170px;}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;
    padding:11px 18px;border-radius:99px;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    .toast, .day-cell, .chip, .nav-btn, .btn{transition:none;}
  }

  /* ---------- public-site additions ---------- */
  .stamp{
    align-self:center;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);
    display:flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .stamp-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;}
  .stamp.stale .stamp-dot{background:var(--danger);}
  .banner.warn{background:var(--danger-soft);color:var(--ink);border-color:var(--danger);}
  .day-cell.no-events{cursor:default;}
  .day-cell.no-events:hover{background:var(--surface);}
  .site-foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--ink-faint);}
  noscript{display:block;padding:20px;text-align:center;color:var(--ink-soft);}

  /* ---------- overflow fixes + phone layout ---------- */
  .layout{grid-template-columns:minmax(0,1fr) 300px;}
  @media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr);}.sidebar{position:static;}}
  .weekday-row,.grid{grid-template-columns:repeat(7,minmax(0,1fr));}
  .day-cell{min-width:0;overflow:hidden;}
  .calendar-panel,.sidebar,.panel{min-width:0;}
  @media (max-width:560px){
    .page{padding:20px 16px 48px;}
    .calendar-panel{padding:10px;}
    .grid{gap:3px;}
    .day-cell{min-height:58px;padding:5px 3px;align-items:center;gap:3px;}
    .day-cell .chip{width:auto;padding:0;background:none;gap:0;}
    .day-cell .chip-title{display:none;}
    .day-cell .chip-dot{width:8px;height:8px;}
    .day-cell{flex-flow:row wrap;align-content:flex-start;justify-content:center;}
    .day-cell .day-number{width:100%;text-align:center;}
    .day-cell.today .day-number{width:22px;margin:0 calc(50% - 11px);}
    .more-chip{display:none;}
    .weekday-row{font-size:10px;letter-spacing:.02em;}
  }

</style>
</head>

  /* ---------------- helpers ---------------- */
  function $(id){ return document.getElementById(id); }
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function toISODate(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function todayISO(){ return toISODate(new Date()); }
  function parseISODate(s){
    var p = s.split("-");
    return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  }
  function formatLongDate(iso){
    return parseISODate(iso).toLocaleDateString(undefined, { weekday:"long", year:"numeric", month:"long", day:"numeric" });
  }
  function formatShortDate(iso){
    return parseISODate(iso).toLocaleDateString(undefined, { month:"short", day:"numeric" }).toUpperCase();
  }
  function formatMediumDate(iso){
    if(!iso) return "";
    return parseISODate(iso).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
  }
  function formatTime(t){
    if(!t) return "";
    var p = t.split(":");
    var h = parseInt(p[0],10), m = p[1];
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    return h12 + ":" + m + " " + (h >= 12 ? "PM" : "AM");
  }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function eventEndDate(ev){ return ev.endDate || ev.date; }
  function eventOnDay(ev, iso){ return ev.date <= iso && iso <= eventEndDate(ev); }
  function addDays(iso, n){
    var d = parseISODate(iso);
    d.setDate(d.getDate() + n);
    return toISODate(d);
  }
  function daysBetween(a, b){ return Math.round((parseISODate(b) - parseISODate(a)) / 86400000); }
  function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function safeSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  function shiftByPeriod(iso, unit, n){
    if(n === 0) return iso;
    var d = parseISODate(iso);
    if(unit === "weekly"){ d.setDate(d.getDate() + 7 * n); return toISODate(d); }
    if(unit === "monthly" || unit === "yearly"){
      var total = d.getMonth() + n * (unit === "yearly" ? 12 : 1);
      var year = d.getFullYear() + Math.floor(total / 12);
      var month = ((total % 12) + 12) % 12;
      var last = new Date(year, month + 1, 0).getDate();
      return toISODate(new Date(year, month, Math.min(d.getDate(), last)));
    }
    return iso;
  }
  function expandOccurrences(ev, startISO, endISO){
    if(!ev.recurrence || ev.recurrence === "none"){
      if(eventEndDate(ev) >= startISO && ev.date <= endISO) return [{ date: ev.date, endDate: ev.endDate || null }];
      return [];
    }
    var duration = ev.endDate ? daysBetween(ev.date, ev.endDate) : 0;
    var out = [];
    for(var n = 0; n < MAX_OCCURRENCE_ITER; n++){
      var s = shiftByPeriod(ev.date, ev.recurrence, n);
      if(s > endISO) break;
      if(ev.recurrenceEnd && s > ev.recurrenceEnd) break;
      var e = duration > 0 ? addDays(s, duration) : null;
      if((e || s) >= startISO) out.push({ date: s, endDate: e });
    }
    return out;
  }

  /** Only http(s) and mailto links. Bare domains get https://. Anything else is dropped. */
  function safeUrl(raw){
    var v = String(raw == null ? "" : raw).trim();
    if(!v) return null;
    if(/^(https?:\/\/|mailto:)/i.test(v)) return v;
    if(/^[a-z][a-z0-9+.-]*:/i.test(v)) return null;
    return "https://" + v;
  }
  function linkDisplayText(url){
    try {
      var u = new URL(url);
      var t = u.hostname.replace(/^www\./, "");
      if(u.pathname && u.pathname !== "/") t += u.pathname.length > 22 ? u.pathname.slice(0, 22) + "…" : u.pathname;
      return t;
    } catch(e){ return url.length > 40 ? url.slice(0, 40) + "…" : url; }
  }
  /** Turns a Google Drive share link into an embeddable thumbnail URL; other https image URLs pass through. */
  function imageUrl(raw){
    var u = safeUrl(raw);
    if(!u || !/^https:/i.test(u)) return null;
    var m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) ||
            u.match(/drive\.google\.com\/(?:open|uc)\?[^#]*\bid=([\w-]+)/);
    if(m) return "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1200";
    return u;
  }

  /* ---------------- normalizers (sheet row -> model) ---------------- */
  function str(v){ return v == null ? "" : String(v).trim(); }
  function normDate(v){
    var s = str(v);
    return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : "";
  }
  function normTime(v){
    var s = str(v);
    var m = s.match(/^(\d{1,2}):(\d{2})/);
    return m ? pad(parseInt(m[1],10)) + ":" + m[2] : "";
  }
  function normCategory(v){
    var s = str(v).toLowerCase();
    if(/holiday/.test(s)) return "holiday";
    if(/train|academy/.test(s)) return "training";
    if(/eval|deadline/.test(s)) return "deadline";
    if(/birth|anniv|celebr/.test(s)) return "celebration";
    return "meeting";
  }
  function normRepeat(v){
    var s = str(v).toLowerCase();
    if(/week/.test(s)) return "weekly";
    if(/month/.test(s)) return "monthly";
    if(/year|annual/.test(s)) return "yearly";
    return "none";
  }
  function normMemoType(v){
    var s = str(v).toLowerCase();
    if(/conduct|coc/.test(s)) return "coc";
    if(/announce/.test(s)) return "announcement";
    if(/polic/.test(s)) return "policy";
    return "memo";
  }
  function truthy(v){ return v === true || /^(true|yes|y|1|x)$/i.test(str(v)); }

  function normalizeData(data){
    var events = [], birthdays = [], memos = [];
    (data.events || []).forEach(function(r, i){
      var title = str(r.title), date = normDate(r.date);
      if(!title || !date) return;
      var end = normDate(r.end_date);
      if(end && end <= date) end = "";
      var time = normTime(r.start_time);
      events.push({
        id: "e" + i, title: title, category: normCategory(r.category),
        date: date, endDate: end || null,
        allDay: !time, time: time || null, endTime: time ? (normTime(r.end_time) || null) : null,
        recurrence: normRepeat(r.repeats), recurrenceEnd: normDate(r.repeat_until) || null,
        location: str(r.location) || null, photo: imageUrl(r.image_url), link: safeUrl(r.link),
        description: str(r.details) || null, addedBy: str(r.posted_by) || null
      });
    });
    (data.birthdays || []).forEach(function(r, i){
      var name = str(r.name), month = parseInt(r.month, 10), day = parseInt(r.day, 10);
      if(!name || !(month >= 1 && month <= 12) || !(day >= 1 && day <= 31)) return;
      birthdays.push({ id: "b" + i, name: name, month: month, day: day, team: str(r.team) || null });
    });
    (data.memos || []).forEach(function(r, i){
      var title = str(r.title);
      if(!title) return;
      memos.push({
        id: "m" + i, title: title, type: normMemoType(r.type),
        date: normDate(r.date), effective: normDate(r.effective_date) || null,
        addedBy: str(r.issued_by) || null, body: String(r.message == null ? "" : r.message),
        link: safeUrl(r.link), pinned: truthy(r.pinned)
      });
    });
    return { events: events, birthdays: birthdays, memos: memos };
  }

  /* ---------------- state ---------------- */
  var today = new Date();
  var viewYear = today.getFullYear(), viewMonth = today.getMonth();
  var events = [], birthdays = [], memos = [];
  var loaded = false;
  var instanceCache = {};
  var currentTab = "events";
  var memoFilter = "all";
  var lastPayload = "";

  var el = {
    monthLabel: $("monthLabel"), calGrid: $("calGrid"), legend: $("legend"),
    upcomingList: $("upcomingList"), banner: $("banner"), stamp: $("stamp"), stampText: $("stampText"),
    dayOverlay: $("dayOverlay"), dayPanelTitle: $("dayPanelTitle"), dayPanelList: $("dayPanelList"),
    detailOverlay: $("detailOverlay"), detailBadge: $("detailBadge"), detailTitle: $("detailTitle"),
    detailPhotoWrap: $("detailPhotoWrap"), detailRows: $("detailRows"),
    memoOverlay: $("memoOverlay")
  };

  /* ---------------- instances ---------------- */
  function bdayDateForYear(b, year){
    var day = b.day;
    if(b.month === 2 && b.day === 29){
      var leap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
      if(!leap) day = 28;
    }
    var last = new Date(year, b.month, 0).getDate();
    return year + "-" + pad(b.month) + "-" + pad(Math.min(day, last));
  }
  function nextBirthday(b, fromISO){
    var y = parseInt(fromISO.slice(0, 4), 10);
    var d = bdayDateForYear(b, y);
    return d < fromISO ? bdayDateForYear(b, y + 1) : d;
  }
  function collectInstances(startISO, endISO){
    var list = [];
    events.forEach(function(ev){
      expandOccurrences(ev, startISO, endISO).forEach(function(occ){
        var key = ev.id + "__" + occ.date;
        var inst = Object.assign({}, ev, { date: occ.date, endDate: occ.endDate, _key: key });
        instanceCache[key] = inst;
        list.push(inst);
      });
    });
    var y1 = parseInt(startISO.slice(0, 4), 10), y2 = parseInt(endISO.slice(0, 4), 10);
    birthdays.forEach(function(b){
      for(var y = y1; y <= y2; y++){
        var date = bdayDateForYear(b, y);
        if(date < startISO || date > endISO) continue;
        var key = "bday__" + b.id + "__" + date;
        var inst = {
          id: b.id, title: b.name + "'s birthday", category: "celebration", date: date, endDate: null,
          allDay: true, recurrence: "yearly", description: b.team ? "Team: " + b.team : null,
          _birthday: true, _key: key
        };
        instanceCache[key] = inst;
        list.push(inst);
      }
    });
    return list;
  }
  function byTime(a, b){ return (a.time || "") < (b.time || "") ? -1 : (a.time || "") > (b.time || "") ? 1 : 0; }
  function metaBits(ev){
    var bits = [];
    if(ev.allDay) bits.push("All day");
    else if(ev.time) bits.push(formatTime(ev.time) + (ev.endTime ? "–" + formatTime(ev.endTime) : ""));
    if(ev.location) bits.push(ev.location);
    if(ev.recurrence && ev.recurrence !== "none") bits.push(RECURRENCE_LABELS[ev.recurrence]);
    return bits.join(" · ");
  }

  /* ---------------- legend ---------------- */
  el.legend.innerHTML = CAT_ORDER.map(function(c){
    return '<span class="legend-item"><span class="legend-dot" style="background:var(' + CATEGORIES[c].varName + ')"></span>' +
      escapeHtml(CATEGORIES[c].label) + '</span>';
  }).join("");

  /* ---------------- calendar ---------------- */
  function makeKeyboardActivatable(node){
    node.setAttribute("tabindex", "0");
    node.setAttribute("role", "button");
    node.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); node.click(); }
    });

  function renderGrid(){
    el.monthLabel.textContent = MONTHS[viewMonth] + " " + viewYear;
    el.calGrid.innerHTML = "";
    var gridStart = new Date(viewYear, viewMonth, 1 - new Date(viewYear, viewMonth, 1).getDay());
    var startISO = toISODate(gridStart);
    var endISO = toISODate(new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + 41));
    var todayStr = todayISO();
    var all = collectInstances(startISO, endISO);

    for(var i = 0; i < 42; i++){
      (function(){
        var d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
        var iso = toISODate(d);
        var dayEvents = all.filter(function(ev){ return eventOnDay(ev, iso); }).sort(byTime);
        var cell = document.createElement("div");
        cell.className = "day-cell" + (d.getMonth() === viewMonth ? "" : " other-month") +
          (iso === todayStr ? " today" : "") + (dayEvents.length ? "" : " no-events");
        cell.setAttribute("aria-label", d.toLocaleDateString(undefined, { month:"long", day:"numeric", year:"numeric" }) +
          (dayEvents.length ? ", " + dayEvents.length + (dayEvents.length === 1 ? " event" : " events") : ""));
        var html = '<span class="day-number">' + d.getDate() + '</span>';
        dayEvents.slice(0, 3).forEach(function(ev){
          html += '<span class="chip" data-open-event="' + ev._key + '">' +
            '<span class="chip-dot" style="background:var(' + CATEGORIES[ev.category].varName + ')"></span>' +
            '<span class="chip-title">' + escapeHtml(ev.title) + '</span></span>';
        });
        if(dayEvents.length > 3){
          html += '<span class="more-chip" data-open-day="' + iso + '">+' + (dayEvents.length - 3) + ' more</span>';
        }
        cell.innerHTML = html;
        if(dayEvents.length){
          makeKeyboardActivatable(cell);
          cell.addEventListener("click", function(e){
            if(e.target.closest("[data-open-event]") || e.target.closest("[data-open-day]")) return;
            openDayPanel(iso);
          });
        }
        el.calGrid.appendChild(cell);
      })();
    }
    Array.prototype.forEach.call(el.calGrid.querySelectorAll("[data-open-event]"), function(n){
      makeKeyboardActivatable(n);
      n.addEventListener("click", function(e){ e.stopPropagation(); openDetail(n.getAttribute("data-open-event")); });
    });
    Array.prototype.forEach.call(el.calGrid.querySelectorAll("[data-open-day]"), function(n){
      makeKeyboardActivatable(n);
      n.addEventListener("click", function(e){ e.stopPropagation(); openDayPanel(n.getAttribute("data-open-day")); });
    });
  }

  function renderUpcoming(){
    if(!loaded){ el.upcomingList.innerHTML = '<div class="empty-state">Loading events…</div>'; return; }
    var t = todayISO();
    var list = collectInstances(t, addDays(t, SIDEBAR_LOOKAHEAD_DAYS))
      .filter(function(ev){ return eventEndDate(ev) >= t; })
      .sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })
      .slice(0, 8);
    if(!list.length){
      el.upcomingList.innerHTML = '<div class="empty-state">No upcoming events yet.<br>HR will post them here.</div>';
      return;
    }
    el.upcomingList.innerHTML = list.map(function(ev){
      return '<button class="upcoming-item" data-open-event="' + ev._key + '" style="--cat:var(' + CATEGORIES[ev.category].varName + ')">' +
        '<span class="upcoming-date">' + formatShortDate(ev.date).replace(" ", "<br>") + '</span>' +
        '<span><span class="upcoming-title">' + escapeHtml(ev.title) + '</span>' +
        '<div class="upcoming-meta">' + escapeHtml(metaBits(ev)) + '</div></span></button>';
    }).join("");
    Array.prototype.forEach.call(el.upcomingList.querySelectorAll("[data-open-event]"), function(n){
      n.addEventListener("click", function(){ openDetail(n.getAttribute("data-open-event")); });
    });
  }

  /* ---------------- day panel + detail ---------------- */
  function openDayPanel(iso){
    var list = collectInstances(iso, iso).filter(function(ev){ return eventOnDay(ev, iso); }).sort(byTime);
    el.dayPanelTitle.textContent = formatLongDate(iso);
    if(!list.length){
      el.dayPanelList.innerHTML = '<div class="empty-state">Nothing on this day.</div>';
    } else {
      el.dayPanelList.innerHTML = list.map(function(ev){
        var tag = ev.allDay ? "ALL DAY" : (ev.time ? formatTime(ev.time) : "—");
        return '<button class="upcoming-item" data-open-event="' + ev._key + '" style="--cat:var(' + CATEGORIES[ev.category].varName + ')">' +
          '<span class="upcoming-date">' + tag + '</span>' +
          '<span><span class="upcoming-title">' + escapeHtml(ev.title) + '</span>' +
          '<div class="upcoming-meta">' + escapeHtml(metaBits(ev)) + '</div></span></button>';
      }).join("");
      Array.prototype.forEach.call(el.dayPanelList.querySelectorAll("[data-open-event]"), function(n){
        n.addEventListener("click", function(){ el.dayOverlay.hidden = true; openDetail(n.getAttribute("data-open-event")); });
      });
    }
    el.dayOverlay.hidden = false;
  }

  function openDetail(key){
    var ev = instanceCache[key];
    if(!ev) return;
    var cat = CATEGORIES[ev.category] || CATEGORIES.meeting;
    el.detailBadge.innerHTML = '<span class="badge-dot"></span>' + escapeHtml(cat.label);
    el.detailBadge.style.background = "var(" + cat.varName + ")";
    el.detailTitle.textContent = ev.title;

    if(ev.photo){
      el.detailPhotoWrap.innerHTML = '<img class="detail-photo" referrerpolicy="no-referrer" src="' + escapeHtml(ev.photo) + '" alt="' + escapeHtml(ev.title) + '">';
      var img = el.detailPhotoWrap.querySelector("img");
      img.addEventListener("error", function(){ el.detailPhotoWrap.hidden = true; });
      el.detailPhotoWrap.hidden = false;
    } else {
      el.detailPhotoWrap.innerHTML = "";
      el.detailPhotoWrap.hidden = true;
    }

    var when = formatLongDate(ev.date);
    if(ev.endDate && ev.endDate !== ev.date) when += " through " + formatLongDate(ev.endDate);
    var timeStr = ev.allDay ? "All day" : formatTime(ev.time) + (ev.endTime ? " to " + formatTime(ev.endTime) : "");
    function row(label, value, cls){
      return '<div class="detail-row"><span class="detail-label">' + label + '</span><span class="detail-value' + (cls ? " " + cls : "") + '">' + value + '</span></div>';
    }
    var rows = row("When", escapeHtml(when)) + row("Time", escapeHtml(timeStr));
    if(ev.recurrence && ev.recurrence !== "none"){
      var r = RECURRENCE_LABELS[ev.recurrence];
      if(ev.recurrenceEnd) r += " until " + formatLongDate(ev.recurrenceEnd);
      rows += row("Repeats", escapeHtml(r));
    }
    if(ev.location) rows += row("Where", escapeHtml(ev.location));
    if(ev.link) rows += row("Link", '<a class="detail-link" href="' + escapeHtml(ev.link) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(linkDisplayText(ev.link)) + ' ↗</a>');
    if(ev.description) rows += row("Details", escapeHtml(ev.description));
    if(!ev._birthday) rows += row("Posted by", escapeHtml(ev.addedBy || "HR"), "muted");
    el.detailRows.innerHTML = rows;
    el.detailOverlay.hidden = false;
  }

  /* ---------------- birthdays ---------------- */
  function renderBirthdays(){
    var host = $("bdayList");
    if(!loaded){ host.innerHTML = '<div class="empty-state">Loading birthdays…</div>'; return; }
    var t = todayISO(), thisYear = parseInt(t.slice(0, 4), 10);
    var rows = birthdays.map(function(b){
      var next = nextBirthday(b, t);
      return { b: b, next: next, days: daysBetween(t, next) };
    }).sort(function(x, y){ return x.days - y.days || x.b.name.localeCompare(y.b.name); });
    $("bdayCount").textContent = rows.length ? rows.length + (rows.length === 1 ? " person" : " people") : "";
    if(!rows.length){ host.innerHTML = '<div class="empty-state">No birthdays yet.<br>HR will add them here.</div>'; return; }
    var html = "", lastKey = "";
    rows.forEach(function(r){
      var d = parseISODate(r.next);
      var key = d.getFullYear() + "-" + d.getMonth();
      if(key !== lastKey){
        lastKey = key;
        var label = MONTHS[d.getMonth()];
        if(d.getFullYear() !== thisYear) label += " " + d.getFullYear();
        html += '<div class="bday-month">' + escapeHtml(label) + '</div>';
      }
      var when = r.days === 0 ? "Today" : (r.days === 1 ? "Tomorrow" : "in " + r.days + " days");
      html += '<div class="bday-row' + (r.days === 0 ? " today" : "") + '">' +
        '<span class="bday-date">' + MONTHS[r.b.month - 1].slice(0, 3).toUpperCase() + '<br>' + r.b.day + '</span>' +
        '<span><span class="bday-name">' + escapeHtml(r.b.name) + '</span>' +
        (r.b.team ? '<div class="bday-team">' + escapeHtml(r.b.team) + '</div>' : '') + '</span>' +
        '<span class="bday-when">' + when + '</span></div>';
    });
    host.innerHTML = html;
  }

  /* ---------------- memos ---------------- */
  function sortedMemos(){
    return memos.slice().sort(function(a, b){
      if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return 0;
    });

  function renderMemos(){

        '<span class="memo-title">' + escapeHtml(m.title) + '</span>' +

  var failures = 0;
  function load(){
    if(!API_URL){
      if(!loaded){
        applyData(sampleData());
        showBanner("Preview mode: showing sample data. Add your Apps Script URL to API_URL in this file to go live.", false);
        setStamp("Sample data", true);
      }
      return;
    }
    var url = API_URL + (API_URL.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
    fetch(url, { cache: "no-store" })
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function(text){
        var data = JSON.parse(text);
        if(!data || data.ok === false) throw new Error((data && data.error) || "Bad response");
        failures = 0;
        showBanner("", false);
        if(text !== lastPayload || !loaded){
          lastPayload = text;
          applyData(data);
        }
        setStamp("Updated " + clockLabel(), false);
      })
      .catch(function(){
        failures += 1;
        if(!loaded){
          showBanner("Can't load the calendar right now. Retrying automatically…", true);
          setStamp("Offline", true);
        } else if(failures >= 2){
          setStamp("Offline · showing last update", true);
        }
      });
  }

  /* ---------------- boot ---------------- */
  try {
    var favicon = document.createElement("link");
    favicon.rel = "icon";
    favicon.href = $("brandMark").src;
    document.head.appendChild(favicon);
  } catch(e){}
  switchTab(safeGet("tbsi_site_tab") || "events");
  renderAll();
  load();
  setInterval(load, REFRESH_MS);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) load(); });
  // roll the "today" highlight over if the page is left open past midnight
  setInterval(function(){ if(loaded) renderAll(); }, 30 * 60 * 1000);
})();

</script>
</body>
</html>
